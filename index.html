<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Landing Page</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, serif;
        }

        body {
            min-height: 100vh;
            background: #f8bcbc;
            padding: 40px 15px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Navbar */
        header {
            width: 100%;
            min-height: 60px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 12px 20px;
        }

        .logo {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
        }

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            padding: 7px 10px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        nav a.active {
            background: #fff;
            color: #000;
        }

        nav a:hover {
            background: #fff;
            color: #000;
        }

        /* Hero Section */
        .hero {
            width: 100%;
            height: 500px;
            position: relative;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
        }

        /* Background Image */
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .bg-img img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
        }

        /* Image Overlay */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.12);
            z-index: 1;
        }

        /* Hero Heading */
        .hero h1 {
            position: relative;
            z-index: 2;
            text-align: center;
            padding-top: 25px;
            color: #222;
            font-size: 55px;
        }

        /* Footer */
        footer {
            width: 100%;
            margin-top: 15px;
            text-align: center;
            color: #333;
            font-size: 14px;
        }

        footer span {
            color: red;
            font-weight: bold;
        }

        /* Tablet */
        @media (max-width: 700px) {
            body {
                padding: 20px 12px;
            }

            header {
                flex-direction: column;
                gap: 12px;
                padding: 15px;
            }

            nav {
                justify-content: center;
            }

            nav a {
                font-size: 12px;
                margin: 0;
            }

            .hero {
                height: 400px;
            }

            .hero h1 {
                font-size: 45px;
            }
        }

        /* Mobile */
        @media (max-width: 400px) {
            .logo {
                font-size: 24px;
            }

            nav {
                gap: 4px;
            }

            nav a {
                padding: 7px 6px;
                font-size: 11px;
            }

            .hero {
                height: 350px;
            }

            .hero h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Navbar -->
        <header>
            <div class="logo">LOGO</div>

            <nav>
                <a class="active" href="#">HOME</a>
                <a href="#">ABOUT</a>
                <a href="#">MENU</a>
                <a href="#">ORDER</a>
                <a href="#">CONTACT</a>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="hero">

            <div class="bg-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS48OhICyCfcPkwYiRBQDIfXyRmT93TDF6Iz1vmfJAyGA&s=10"
                    alt="Mountain landscape">
            </div>

            <h1>Home</h1>

        </section>

        <!-- Footer -->
        <footer>
            <p>Made with ❤️ by <span>Learning Robo</span></p>
        </footer>

    </div>

</body>

</html>
